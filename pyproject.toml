[project]
name = "bjfishing"
version = "0.1.0"
description = "Beijing Fishing Analysis MCP Server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=0.4,<0.5",
    "astral>=3.0,<4.0",
    "metpy>=1.0",
    "requests>=2.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "pip-audit>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "services.server"
disable_error_code = ["no-untyped-call", "untyped-decorator"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
